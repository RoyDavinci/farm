# Local development database. Start with `docker compose up -d` (npm run setup does this).
# Credentials come from the repo-root .env (created by `npm run setup`).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: farmers_market
      POSTGRES_USER: farmers_market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (npm run setup creates it)}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U farmers_market']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:

name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: farmers_market
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: farmers_market_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U farmers_market" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://farmers_market:ci-only-password@localhost:5432/farmers_market_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Tests are optional: they run and report on every push, but failures don't fail the build.
      - name: Tests (optional)
        run: npm test
        continue-on-error: true
      # The OpenAPI contract and generated client types must match the code.
      - run: npm run api:contract && git diff --exit-code apps/api/openapi.json packages/shared/src/api-types.ts
      - run: npm run build
      - run: npm run export:web -w @farmers-market/mobile
      - run: docker build -f apps/api/Dockerfile -t farmers-market-api:ci .

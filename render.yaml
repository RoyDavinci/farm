# Render Blueprint for the Zuru STAGING environment.
# Create it in Render: New → Blueprint → pick this repository. Values marked `sync: false` are asked
# for once during creation (see docs/deploy-staging.md for where each one comes from).
# Services redeploy automatically after GitHub checks (CI) pass on the main branch.

envVarGroups:
  # Shared by the API and the worker. Secrets generated once by Render; identical in both.
  - name: zuru-staging
    envVars:
      - key: NODE_ENV
        value: production
      - key: OTP_SECRET
        generateValue: true
      - key: PAYOUT_ENCRYPTION_KEY
        generateValue: true
      # Launch scope from the brief: core marketplace, booking and delivery; wallet and later-phase
      # features off. Override one switch with FEATURE_<NAME> (see apps/api/src/config/features.ts).
      - key: PILOT_MODE
        value: 'true'
      - key: PAYMENTS_ENABLED
        value: 'true'
      - key: ALLOW_DEMO_FUNDING
        value: 'false'
      - key: PAYMENTS_FALLBACK_PROVIDER
        value: flutterwave
      - key: PAYOUT_PROVIDER
        value: paystack
      - key: FLUTTERWAVE_WEBHOOK_MODE
        value: hmac
      - key: MAIL_MODE
        value: smtp
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: STORAGE_PROVIDER
        value: s3
      - key: RECORDS_STORAGE_PROVIDER
        value: s3
      - key: AWS_REGION
        value: auto
      - key: S3_PREFIX
        value: staging
      - key: PUSH_ENABLED
        value: 'true'
      - key: LOG_LEVEL
        value: http
      - key: TRUST_PROXY
        value: '1'

services:
  - type: web
    name: zuru-api
    runtime: docker
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Database migrations run before each new version starts.
    preDeployCommand: npx prisma migrate deploy
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - fromGroup: zuru-staging
      - key: RUN_WORKERS
        value: 'false'
      - key: DATABASE_URL
        fromDatabase:
          name: zuru-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zuru-redis
          property: connectionString
      # Browser origins allowed by CORS: the two static sites below.
      - key: CORS_ALLOWED_HOSTS_ADMIN
        fromService:
          type: web
          name: zuru-admin
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ALLOWED_HOSTS_WEB
        fromService:
          type: web
          name: zuru-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: RECORDS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MAPBOX_PUBLIC_TOKEN
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false

  - type: worker
    name: zuru-worker
    runtime: docker
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    autoDeployTrigger: checksPass
    envVars:
      - key: EXPO_PUBLIC_WEB_URL
        fromService:
          type: web
          name: zuru-web
          envVarKey: RENDER_EXTERNAL_URL
      - fromGroup: zuru-staging
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: zuru-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: zuru-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zuru-redis
          property: connectionString
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: RECORDS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MAPBOX_PUBLIC_TOKEN
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false

  # Operations console (static).
  - type: web
    name: zuru-admin
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: npm ci --ignore-scripts && npm run build -w @zuru/admin
    staticPublishPath: ./apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: zuru-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  # Mobile app as a website, for testing on any phone browser.
  - type: web
    name: zuru-web
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: npm ci --ignore-scripts && npm run export:web -w @zuru/mobile
    staticPublishPath: ./apps/mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_HOST
        fromService:
          type: web
          name: zuru-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: keyvalue
    name: zuru-redis
    region: frankfurt
    # Internal only: no access from outside Render's private network.
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: zuru-db
    region: frankfurt
    postgresMajorVersion: '17'
    databaseName: farmers_market
    user: farmers_market
